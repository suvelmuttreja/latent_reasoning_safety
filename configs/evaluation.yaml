    Pause before judging, select the next pre-registered task cap using only
    truncation metadata, and regenerate every condition in the affected
    matched comparison symmetrically from scratch.
  stage3_budget_assumption: allow_one_pause_and_full_regeneration_cycle
official_generation_policy:
