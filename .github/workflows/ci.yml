name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      MPLBACKEND: Agg
      UV_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          python-version: "3.11"
          enable-cache: false
          prune-cache: false
      - name: Install the locked environment
        run: uv sync --locked --group report
      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check src tests scripts writeup
          uv run --no-sync ruff format --check src tests scripts writeup
      - name: CPU unit tests
        run: uv run --no-sync pytest
      - name: Evidence, documentation, shell syntax, and numerical reproduction
        run: uv run --no-sync python scripts/verify_repository.py
      - name: Build source and wheel distributions
        run: uv build --out-dir "$RUNNER_TEMP/dist"
      - name: Check verification left the checkout unchanged
        run: git diff --exit-code
