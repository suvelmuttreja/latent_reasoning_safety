name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      MPLBACKEND: Agg
      UV_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.14"
          python-version: "3.11"
      - name: Install the locked environment
        run: uv sync --locked --group report
      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check src tests scripts writeup
          uv run --no-sync ruff format --check src tests scripts writeup
      - name: CPU unit tests
        run: uv run --no-sync pytest
      - name: Evidence, documentation, shell syntax, and numerical reproduction
        run: uv run --no-sync python scripts/verify_repository.py
      - name: Check verification left the checkout unchanged
        run: git diff --exit-code
