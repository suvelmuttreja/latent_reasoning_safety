[project]
name = "mats-latent-safety"
version = "0.1.0"
description = "Registered Coconut-SFT safety-drift experiment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.10.0",
  "datasets==4.0.0",
  "huggingface-hub==0.34.4",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "pyarrow==21.0.0",
  "pyyaml==6.0.2",
  "safetensors==0.6.2",
  "scipy==1.16.1",
  "sentencepiece==0.2.1",
  "strong-reject @ git+https://github.com/dsbowen/strong_reject.git@7a551d5b440ec7b75d4f6f5bb7c1719965b76b47",
  "torch==2.7.1",
  "tqdm==4.67.1",
  "transformers==4.53.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mats_latent_safety"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
